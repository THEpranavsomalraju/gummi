name: Gummi
options:
  bundleIdPrefix: com.mahilmanoharan
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Gummi.xcconfig
  Release: Config/Gummi.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEVELOPMENT_TEAM: 656VZ34X6H
    CODE_SIGN_STYLE: Automatic

targets:
  Gummi:
    type: application
    platform: iOS
    sources:
      - path: Gummi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mahilmanoharan.gummi
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Gummi/Info.plist
      properties:
        CFBundleDisplayName: Gummi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSHealthShareUsageDescription: Gummi reads your step count to show your walks next to your glucose and to coach short walks after meals.
        NSMotionUsageDescription: Gummi uses motion data to count steps and measure your pace during a walk.
        GummiAPIBaseURL: $(GUMMI_API_BASE_URL)
        GummiTokenURL: $(GUMMI_TOKEN_URL)
        GummiClientID: $(GUMMI_CLIENT_ID)
        GummiClientSecret: $(GUMMI_CLIENT_SECRET)
        GummiUserID: $(GUMMI_USER_ID)
    entitlements:
      path: Gummi/Gummi.entitlements
      properties:
        com.apple.developer.healthkit: true
    scheme:
      testTargets:
        - GummiTests

  GummiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GummiTests
    dependencies:
      - target: Gummi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mahilmanoharan.gummi.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
