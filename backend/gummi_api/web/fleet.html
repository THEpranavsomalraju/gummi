<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gummi Fleet</title>
<style>
  :root { --bg: #0f1420; --panel: #182033; --text: #eef2fa; --muted: #95a0b8; --line: #2a3550;
          --gummi: #7cc4ff; --cgm: #c9a2ff; --last: #ffb36b; --range: rgba(124,196,255,0.10); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 18px/1.35 -apple-system, system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 32px; align-items: baseline; padding: 20px 28px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 30px; }
  .stat { color: var(--muted); font-size: 16px; }
  .stat b { display: block; color: var(--text); font-size: 28px; font-variant-numeric: tabular-nums; }
  .acc b span { font-size: 20px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; padding: 20px 28px; }
  .tile { background: var(--panel); border-radius: 12px; padding: 12px 14px; }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .name { font-weight: 600; }
  .mood { font-size: 14px; color: var(--muted); }
  svg { width: 100%; height: 70px; display: block; margin: 6px 0; }
  .nums { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .nums .g { color: var(--gummi); } .nums .c { color: var(--cgm); } .nums .l { color: var(--last); }
  footer { padding: 0 28px 20px; color: var(--muted); font-size: 14px; }
  .mode { padding: 2px 8px; border: 1px solid var(--line); border-radius: 6px; font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Gummi fleet <span class="mode" id="mode">…</span></h1>
  <div class="stat acc">Mean abs. error, out-of-sample<b id="acc">–</b></div>
  <div class="stat">Replay clock<b id="clock">–</b></div>
  <div class="stat">Events / s<b id="eps">–</b></div>
  <div class="stat">Pipeline lag<b id="lag">–</b></div>
  <div class="stat">Events released<b id="released">–</b></div>
</header>
<div class="grid" id="grid"></div>
<footer>Gummi <span style="color:var(--gummi)">■</span> · CGM-only <span style="color:var(--cgm)">■</span> · last value <span style="color:var(--last)">■</span> in mg/dL. Shaded band 70 to 140. Not for treatment decisions.</footer>
<script>
const LO = 70, HI = 140, YMIN = 55, YMAX = 220;
function spark(points) {
  if (!points.length) return "";
  const xs = points.map(p => Date.parse(p.t)), x0 = Math.min(...xs), x1 = Math.max(...xs) || x0 + 1;
  const X = t => ((t - x0) / (x1 - x0 || 1)) * 300, Y = g => 70 - ((Math.min(YMAX, Math.max(YMIN, g)) - YMIN) / (YMAX - YMIN)) * 70;
  const d = points.map((p, i) => `${i ? "L" : "M"}${X(Date.parse(p.t)).toFixed(1)},${Y(p.glucose_mg_dl).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 300 70" preserveAspectRatio="none" aria-hidden="true">
    <rect x="0" y="${Y(HI)}" width="300" height="${Y(LO) - Y(HI)}" fill="var(--range)"/>
    <path d="${d}" fill="none" stroke="var(--gummi)" stroke-width="2.2" vector-effect="non-scaling-stroke"/></svg>`;
}
const fmt = v => v == null ? "–" : v.toFixed(1);
async function tick() {
  try {
    const r = await fetch("../fleet", { headers: { "X-User-Id": "u_projector" } });
    document.getElementById("mode").textContent = r.headers.get("X-Gummi-Mode") || "?";
    const f = await r.json(), s = f.stream;
    document.getElementById("acc").innerHTML =
      `<span class="g" style="color:var(--gummi)">${fmt(f.fleet_gummi_mae_mg_dl)}</span> <span>vs</span> ` +
      `<span style="color:var(--cgm)">${fmt(f.fleet_cgm_only_mae_mg_dl)}</span> <span>vs</span> ` +
      `<span style="color:var(--last)">${fmt(f.fleet_last_value_mae_mg_dl)}</span>`;
    document.getElementById("clock").textContent = s.running ? (s.paused ? `${s.replay_clock} (paused)` : `${s.replay_clock} · ${s.speed}x`) : "stopped";
    document.getElementById("eps").textContent = s.events_per_second.toFixed(1);
    document.getElementById("lag").textContent = s.pipeline_lag_seconds == null ? "–" : `${Math.round(s.pipeline_lag_seconds)} s`;
    document.getElementById("released").textContent = s.events_released.toLocaleString();
    document.getElementById("grid").innerHTML = f.entries.map(e => `
      <div class="tile"><div class="top"><span class="name">${e.display_name}</span><span class="mood">${e.mood}</span></div>
      ${spark(e.sparkline)}
      <div class="nums"><span class="g">${fmt(e.gummi_mae_mg_dl)}</span> · <span class="c">${fmt(e.cgm_only_mae_mg_dl)}</span> ·
      <span class="l">${fmt(e.last_value_mae_mg_dl)}</span> · ${e.grades} grades</div></div>`).join("");
  } catch (err) { document.getElementById("mode").textContent = "reconnecting"; }
}
tick(); setInterval(tick, 3000);
</script>
</body>
</html>
