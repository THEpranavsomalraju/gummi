<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gummi Dexcom</title>
<style>
  :root { --text:#1d2433; --muted:#4b5568; --line:#d9dee8; --accent:#2f7d5b; --bg:#ffffff; }
  @media (prefers-color-scheme: dark) { :root { --text:#eef2fa; --muted:#a3adc2; --line:#2b3651; --accent:#7fd6a8; --bg:#0e1320; } }
  body { font:18px/1.5 -apple-system, system-ui, sans-serif; max-width:560px; margin:64px auto; padding:0 16px; color:var(--text); background:var(--bg); }
  p { color:var(--muted); }
  label { display:block; margin:24px 0 8px; font-weight:600; }
  select, button { font:inherit; padding:10px 14px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--text); }
  button { background:var(--accent); color:#fff; border:none; margin-left:8px; cursor:pointer; }
</style>
</head>
<body>
<h1>Connect the Dexcom sandbox</h1>
<p>This sends you to Dexcom's sandbox login (no password: pick a sandbox user), then back here. Gummi shows the connection, data range and last sync only. It never replaces your Dexcom app.</p>
<form action="connect" method="get">
  <label for="user">Which Gummi user?</label>
  <select id="user" name="user">
    <option value="u_mahil">Mahil</option>
    <option value="u_pranav">Pranav</option>
    <option value="u_nikhil">Nikhil</option>
  </select>
  <button type="submit">Connect</button>
</form>
</body>
</html>
