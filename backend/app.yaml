command: ["python", "-m", "gummi_api"]
env:
  - name: GUMMI_CATALOG
    value: workspace
  - name: GUMMI_MODE
    value: live
  - name: GUMMI_MODEL_DIR
    value: /Volumes/workspace/gummi_ml/artifacts/gummi_model_v1_next
  - name: GUMMI_LANDING_DIR
    value: /Volumes/workspace/gummi_data/landing/events_live
